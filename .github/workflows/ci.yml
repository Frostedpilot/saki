name: CI

# npm workspaces (root package.json): one install covers engine, server and
# web-client. See docs/known-issues.md KI-02 for why this used to be three
# separate installs with duplicated riichi/syanten copies on disk.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 310 unit tests + 43 in-engine rule checks. The glob form is required:
      # a bare directory argument is rejected by Node 22.
      - name: Engine tests
        run: npm run test:engine

      # 3 headless end-to-end tests: spawns the bridge, drives a full match
      # over a real WebSocket, asserts through GameOver.
      - name: Server end-to-end tests
        run: npm run test:server

      # Client: vitest unit tests (tile logic, rendering, store) plus the `tsc`
      # and production-build gate.
      - name: Client tests, type-check and build
        run: npm run test:client

      # Guards against the arg-parser regression where `--kyoku 1` parsed as
      # NaN and the match loop silently ran zero hands.
      - name: Verify the offline CLI actually plays a hand
        run: |
          npm run smoke --silent > /tmp/saki-smoke.txt
          grep -q 'cut' /tmp/saki-smoke.txt || {
            echo '::error::engine played no hands — CLI arg parsing regressed'
            exit 1
          }
          echo "smoke ok: $(wc -l < /tmp/saki-smoke.txt) lines of play"

      # Relative links in docs/ are easy to break and impossible to notice.
      # Paths under reference/ are gitignored upstream and are skipped.
      - name: Check relative markdown links resolve
        run: npm run links --silent
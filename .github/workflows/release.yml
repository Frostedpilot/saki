name: Release

# Tag-driven release: vX.Y.Z must match the workspace version and have a
# CHANGELOG.md section. The same checks run in CI on every push, so a tag can
# only fail here if the version/changelog moved after the branch was tested.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full check
        run: npm run check

      - name: Verify the tag matches the workspace version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/release-check.mjs --tag "$TAG"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node scripts/release-check.mjs --notes > release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
